    authors:
      - "A. G. Howson"
    id: "10.1112/jlms/s1-29.4.428"
    type: "article"
    location: "https://doi.org/10.1112/jlms/s1-29.4.428"
    relationship: "formalizes"
    note: "Classical source for the finite-generation intersection theorem; the public theorem formalizes its finite-rank free-group statement."
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Topology of finite graphs"
    authors:
      - "John R. Stallings"
    id: "10.1007/BF02095993"
    type: "article"
    location: "https://doi.org/10.1007/BF02095993"
    relationship: "background"
    note: "Provides the finite-core and covering-graph perspective behind the subgroup technology used by the Hall and Kurosh layers."
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Subgroups of finite index in free groups"
    authors:
      - "Marshall Hall, Jr."
    id: "10.4153/CJM-1949-017-2"
    type: "article"
    location: "https://doi.org/10.4153/CJM-1949-017-2"
    relationship: "background"
    note: "Classical finite-index free-group theorem used as the mathematical predecessor for the explicit Hall free-factor construction in the implementation."
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/Arthur742Ramos/MarshallHallTheorem"
    relationship: "builds-on"
    note: "Preceding Lean development supplying the inclusion-compatible Marshall Hall witness, finite-core completion, Schreier basis, and the finite-index subgroup step used here."
  - id: "https://github.com/Arthur742Ramos/GraphCoveringTheory"
    relationship: "builds-on"
    note: "Preceding Lean development supplying the Bass--Serre/Kurosh decomposition and the exact conjugate-intersection factor API used here."
  - id: "https://github.com/leanprover-community/mathlib4/blob/v4.32.0/Mathlib/GroupTheory/FreeGroup/NielsenSchreier.lean"
    relationship: "builds-on"
    note: "Uses Mathlib's free-group and Nielsen--Schreier interfaces for the finite-rank ambient groups."
  - id: "https://github.com/leanprover-community/mathlib4/blob/v4.32.0/Mathlib/GroupTheory/Schreier.lean"
    relationship: "builds-on"
    note: "Uses Mathlib's kernel-checked finite-index Schreier generation instance for the pullback subgroup."

status:
  scope: >-
    The main result covers every finite type alpha and every pair of finitely
    generated subgroups H and K of FreeGroup alpha. It proves
    Group.FG (H ⊓ K). The implementation explicitly passes through a
    finite-index Hall overgroup, the binary free-product bridge, a finitely
    generated Kurosh factor, and a homomorphism induced by the actual factor
    inclusion whose image is exactly H ⊓ K. The repository retains the
    preceding Hall and Kurosh infrastructure as supporting formalization;
    those earlier named results are not presented as new sources here.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "HowsonChallenge.howson_intersection_fg"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "agent"
      models: ["GPT-5 Codex"]
      framework: "Lean 4 and Mathlib"
      tool_setup: "Pinned Lean/Mathlib builds, kernel checking, closure-safe Challenge compilation, and Comparator/NanoDa replay."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "The theorem was developed against the pinned Lean and Mathlib APIs and checked by the Lean kernel."
  spend_usd: "subscription-based"
  notes: "The public statement is isolated from the finite-core, Hall, and Kurosh implementation modules."

fidelity:
  divergences: >-
    The classical Howson property is often stated for an arbitrary free group.
    This submission formalizes the finite-rank form, which is the exact scope
    of the present finite-type development. It proves finite generation of the
    intersection and does not claim Howson's sharper rank bound. The proof's
    Kurosh step is not an abstract isomorphism: the selected factor is the
    actual intersection with a conjugate of the Hall factor, and the final
    homomorphism is defined from the corresponding subgroup inclusion.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The Challenge theorem is a small statement surface with one deliberate
    proof hole excluded from the status counts. Solution.lean and the
    implementation library contain no proof holes or custom axioms. The
    kernel checks the Hall free-factor witness, finite-index Schreier step,
    binary free-product equivalence, Kurosh factor finite generation, and the
    explicit surjection onto H ⊓ K; the pinned Comparator replay checks the
    Challenge/Solution correspondence independently.

alignment:
  namespace: "HowsonChallenge"
  statements:
    - source: "A. G. Howson, On the Intersection of Finitely Generated Free Groups"
      lean: "HowsonChallenge.howson_intersection_fg"
      module: "Solution.lean"
      status: "proved"
      note: "The public theorem states that the intersection of two finitely generated subgroups of a finite-rank free group is finitely generated."
    - source: "Howson implementation theorem"
      lean: "Howson.howson_intersection_fg"
      module: "Howson/Intersection.lean"
      status: "proved"
      note: "The proof uses the inclusion-compatible Hall witness, finite-index Schreier generation, and an inclusion-induced surjection from an exact Kurosh conjugate-intersection factor."
    - source: "Marshall Hall finite-index free-factor theorem"
      lean: "MarshallHall.marshallHall"
      module: "MarshallHall/Hall.lean"
      status: "supporting"
      note: "Supporting preceding formalization: places H inside a finite-index subgroup as an actual free factor, with the left coproduct injection identified with subgroup inclusion."
    - source: "Kurosh subgroup theorem"
      lean: "GraphCoveringTheory.Kurosh.kurosh_decomposition"
      module: "GraphCoveringTheory/KuroshTheorem.lean"
      status: "supporting"
      note: "Supporting preceding formalization: decomposes a subgroup of a free product into its Bass--Serre factors and free part; the Howson proof selects the factor attached to H."

acknowledgements: "Mathlib contributors for the free-group, finite-index, subgroup, quotient, and free-product infrastructure; A. G. Howson, John R. Stallings, and Marshall Hall, Jr. for the mathematical sources; the preceding MarshallHallTheorem and GraphCoveringTheory formalizations; and the Palomar Registry project for the statement/solution Comparator workflow."
