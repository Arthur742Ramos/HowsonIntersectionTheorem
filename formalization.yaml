version: "v0.4"

project:
  name: "Marshall Hall's theorem through finite cores"
  description: >-
    Formalizes Marshall Hall's finite-index free-factor theorem for finitely
    generated subgroups of finite-rank free groups. The proof extracts the
    finitely many suffix states of a subgroup generating set, completes the
    resulting partial generator actions to permutations of a finite state
    set, identifies the connected orbit with a finite core, and extends a
    geodesic spanning tree to obtain an inclusion-compatible free-product
    decomposition. The repository also proves binary and finite-indexed
    free-group instances of Grushko--Neumann rank additivity, the
    arbitrary-factor binary theorem, and the LERF consequence. The
    arbitrary-factor proof is carried by a finite labelled-graph fold,
    source-unfold, and monochromatic-vertex contraction reduction.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy J. G. B. de Queiroz"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

repository:
  role: "substantive-development"

classification:
  arxiv: ["math.GR"]
  msc2020: ["20E07", "20F65", "05C25"]

