    id: "10.4153/CJM-1949-017-2"
    type: "article"
    location: "https://doi.org/10.4153/CJM-1949-017-2"
    relationship: "adapts"
    note: "Classical source for the finite-index extension theorem; this repository formalizes its subgroup-separability consequence rather than claiming the full free-factor conclusion."
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Topology of finite graphs"
    authors:
      - "John R. Stallings"
    id: "10.1007/BF02095993"
    type: "article"
    location: "Inventiones Mathematicae 71(3), 551--565 (1983)"
    relationship: "background"
    note: "Original finite-graph and core-graph source for the covering perspective behind the finite-state completion used by the implementation."
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Stallings foldings and subgroups of free groups"
    authors:
      - "Ilya Kapovich"
      - "Alexei Myasnikov"
    id: "10.1006/jabr.2001.9033"
    type: "article"
    location: "Journal of Algebra 248(2), 608--668 (2002)"
    relationship: "background"
    note: "Combinatorial and computational treatment of Stallings foldings; it motivates the finite-core viewpoint, while this repository proves the stated separator by finite permutation completion."
    license: "unknown"
    author_endorsement: "not-contacted"

