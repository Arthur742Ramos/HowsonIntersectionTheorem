    relationship: "builds-on"
    note: "Uses Mathlib's free-group representation and Nielsen--Schreier infrastructure; the finite-core separation construction is developed in this repository."
  - id: "https://github.com/leanprover-community/mathlib4/blob/v4.32.0/Mathlib/GroupTheory/FreeGroup/Reduce.lean"
    relationship: "builds-on"
    note: "Uses the canonical reduced-word encoding and normalization lemmas to enumerate suffix states of finite words."
  - id: "https://github.com/leanprover-community/mathlib4/blob/v4.32.0/Mathlib/GroupTheory/Coset/Basic.lean"
    relationship: "builds-on"
    note: "Uses the left-coset quotient and its exact relation to subgroup membership."
  - id: "https://github.com/leanprover-community/mathlib4/blob/v4.32.0/Mathlib/Logic/Equiv/Fintype.lean"
    relationship: "builds-on"
    note: "Uses `Equiv.extendSubtype` to complete each finite partial generator action to a permutation."
