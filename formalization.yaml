status:
  scope: >-
    The main Hall theorem covers every finite generating type alpha and every
    finitely generated subgroup H of FreeGroup alpha. It produces a subgroup
    K containing H with nonzero natural-number index, a complement, and a
    multiplicative equivalence H * complement ≃* K whose left injection is the
    actual inclusion of H. The same finite-state engine yields the LERF
    separator for any element outside H. The rank result covers binary and
    finite indexed free products of free groups on finite types, and the
    arbitrary-factor binary rank theorem is proved for all finitely generated
    groups by strong induction on the finite labelled graph.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "MarshallHall.marshallHall"
      file: "MarshallHall/Hall.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - declaration: "MarshallHall.rank_binaryFreeProduct"
      file: "MarshallHall/Grushko.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - declaration: "MarshallHall.GeneralGrushko.rank_coprodI_freeGroup"
      file: "MarshallHall/GrushkoGeneral.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - declaration: "MarshallHall.rank_freeProduct_eq_add"
      file: "MarshallHall.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - declaration: "freeGroup_subgroup_separable"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "agent"
      models: ["GPT-5 Codex"]
      framework: "Lean 4 and Mathlib"
      tool_setup: "Pinned Lean/Mathlib builds, kernel checking, closure-safe Challenge compilation, and Comparator/NanoDa replay."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "The theorem was developed against the pinned Lean and Mathlib APIs and checked by the Lean kernel."
  spend_usd: "subscription-based"
  notes: "The public statement is isolated from the finite-core implementation module."

fidelity:
  divergences: >-
    The registered public Challenge remains the compact subgroup-separability
    statement, while the library additionally proves the stronger Hall
    free-factor theorem. The formal index condition is `K.index ≠ 0`, matching
    Mathlib's convention that an infinite-index subgroup has index zero. The
    finite cover is encoded as a finite permutation action on a set of
    left-coset states; each partial generator action is completed by an
    equivalence extension. The finite-indexed free-group rank calculation is
    restricted to free factors that are themselves free groups on finite
    types; the binary arbitrary-factor theorem applies to all finitely
    generated factors and is proved by the finite graph reduction in
    `MarshallHall/GrushkoFull.lean`.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The Challenge theorem is a small statement surface with one deliberate
    proof hole excluded from the status counts. The Solution and implementation
    library contain no proof holes or nonstandard axioms. The finite
    suffix-state construction, permutation completion, basepoint stabilizer,
    finite-index argument, subgroup containment, free-factor retraction, rank
    calculations, and arbitrary-factor graph reduction are checked by Lean's
    kernel; the pinned Comparator replay checks the Challenge/Solution
    correspondence independently.

alignment:
  namespace: ""
  statements:
    - source: "Marshall Hall, Subgroups of Finite Index in Free Groups"
      lean: "freeGroup_subgroup_separable"
      module: "Solution.lean"
      status: "proved"
      note: "For a finitely generated subgroup H, the library constructs a finite-index K containing H with an explicit inclusion-compatible free-factor decomposition; the registered surface exposes the LERF corollary for g outside H."
    - source: "Marshall Hall, Subgroups of Finite Index in Free Groups"
      lean: "MarshallHall.marshallHall"
      module: "MarshallHall/Hall.lean"
      status: "proved"
      note: "The witness records K, H ≤ K, nonzero index, a complement, and the actual subgroup inclusion under the coproduct equivalence."
    - source: "B. H. Neumann, On the Number of Generators of a Free Product"
      lean: "MarshallHall.rank_binaryFreeProduct"
      module: "MarshallHall/Grushko.lean"
      status: "proved"
      note: "Binary rank additivity is formalized for free groups on finite types; the lower bound is certified through free abelianization."
    - source: "B. H. Neumann, On the Number of Generators of a Free Product"
      lean: "MarshallHall.GeneralGrushko.rank_coprodI_freeGroup"
      module: "MarshallHall/GrushkoGeneral.lean"
      status: "proved"
      note: "The finite indexed free-group case is transported through the canonical indexed free-product equivalence."
    - source: "B. H. Neumann, On the Number of Generators of a Free Product"
      lean: "MarshallHall.rank_freeProduct_eq_add"
      module: "MarshallHall.lean"
      status: "proved"
      note: "The arbitrary-factor binary theorem is obtained from a kernel-checked finite labelled-graph reduction, including the source-unfold and monochromatic-vertex contraction cases."
    - source: "Stallings finite-core method"
      lean: "MarshallHall.freeGroup_subgroup_separable_proved"
      module: "MarshallHall/Separation.lean"
      status: "proved"
      note: "The implementation enumerates suffix states, completes partial label actions, and uses the resulting basepoint stabilizer."
    - source: "Mathlib GroupTheory FreeGroup Reduce"
      lean: "MarshallHall.wordValue_eq_freeGroup_mk"
      module: "MarshallHall/FiniteCore.lean"
      status: "proved"
      note: "The finite-core word evaluator agrees with Mathlib's reduced free-group word representation."

acknowledgements: "Mathlib contributors for the free-group, quotient, finite-type, permutation, and group-action infrastructure; John R. Stallings, Ilya Kapovich, and Alexei Myasnikov for the finite-core and folding perspectives; Marshall Hall, Jr. for the classical theorem; and the Palomar Registry project for the statement/solution Comparator workflow."
