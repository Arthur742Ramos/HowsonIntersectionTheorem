status:
  scope: >-
    The headline theorem covers every finite generating type alpha, every
    finitely generated subgroup H of FreeGroup alpha, and every element g not
    in H. It produces a subgroup K containing H with nonzero natural-number
    index and excluding g. The implementation proves this by a finite
    permutation action built from all suffix states of finite generators and
    the separating word. This is precisely the subgroup-separability/LERF
    consequence of Marshall Hall's theorem. The stronger free-factor
    conclusion (that H is a free factor of K) is intentionally not claimed
    by this first submission and is the next formalization layer.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "freeGroup_subgroup_separable"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "agent"
      models: ["GPT-5 Codex"]
      framework: "Lean 4 and Mathlib"
      tool_setup: "Pinned Lean/Mathlib builds, kernel checking, closure-safe Challenge compilation, and Comparator/NanoDa replay."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "The theorem was developed against the pinned Lean and Mathlib APIs and checked by the Lean kernel."
  spend_usd: "subscription-based"
  notes: "The public statement is isolated from the finite-core implementation module."

fidelity:
  divergences: >-
    The public theorem states the subgroup-separability consequence rather than
    the stronger free-factor conclusion of the full Marshall Hall theorem.
    The formal index condition is `K.index ≠ 0`, matching Mathlib's convention
    that an infinite-index subgroup has index zero. The finite cover is encoded
    as a finite permutation action on a set of left-coset states; each partial
    generator action is completed by an equivalence extension. The proof does
    not claim a full topological classification of covers or a separately
    formalized Stallings folding algorithm.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The Challenge theorem is a small statement surface with one deliberate
    proof hole excluded from the status counts. The Solution and implementation
    library contain no proof holes or nonstandard axioms. The finite
    suffix-state construction, permutation completion, basepoint stabilizer,
    finite-index argument, containment of H, and exclusion of g are checked by
    Lean's kernel; the pinned Comparator replay checks the Challenge/Solution
    correspondence independently.

alignment:
  namespace: ""
  statements:
    - source: "Marshall Hall, Subgroups of Finite Index in Free Groups"
      lean: "freeGroup_subgroup_separable"
      module: "Solution.lean"
      status: "proved"
      note: "For a finitely generated subgroup H and g outside H, a finite-index subgroup K contains H and excludes g."
    - source: "Stallings finite-core method"
      lean: "MarshallHall.freeGroup_subgroup_separable_proved"
      module: "MarshallHall/Separation.lean"
      status: "proved"
      note: "The implementation enumerates suffix states, completes partial label actions, and uses the resulting basepoint stabilizer."
    - source: "Mathlib GroupTheory FreeGroup Reduce"
      lean: "MarshallHall.wordValue_eq_freeGroup_mk"
      module: "MarshallHall/FiniteCore.lean"
      status: "proved"
      note: "The finite-core word evaluator agrees with Mathlib's reduced free-group word representation."

acknowledgements: "Mathlib contributors for the free-group, quotient, finite-type, permutation, and group-action infrastructure; John R. Stallings, Ilya Kapovich, and Alexei Myasnikov for the finite-core and folding perspectives; Marshall Hall, Jr. for the classical theorem; and the Palomar Registry project for the statement/solution Comparator workflow."
