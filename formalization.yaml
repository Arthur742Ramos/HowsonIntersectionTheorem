version: "v0.4"

project:
  name: "Howson's theorem through finite cores and Kurosh decomposition"
  description: >-
    Formalizes Howson's theorem for finite-rank free groups: the intersection
    of two finitely generated subgroups is finitely generated. The proof uses
    the repository's inclusion-compatible Marshall Hall construction to place
    one subgroup as a free factor of a finite-index overgroup, applies
    Schreier's finite-index theorem to the other subgroup, and then uses the
    actual Kurosh decomposition of the resulting subgroup of a binary free
    product. The final map from the relevant conjugate-intersection factor is
    defined from the factor inclusions and proved surjective onto the internal
    subgroup intersection.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy J. G. B. de Queiroz"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

repository:
  role: "substantive-development"

classification:
  arxiv: ["math.GR"]
  msc2020: ["20E07", "20F65", "05C25"]

sources:
