version: "v0.4"

project:
  name: "Finite-core separation for free groups"
  description: >-
    Formalizes the subgroup-separability (LERF) consequence of Marshall
    Hall's theorem for finitely generated subgroups of finitely generated
    free groups. The proof extracts the finitely many suffix states of a
    subgroup generating set and a separating word, completes the resulting
    partial generator actions to permutations of a finite state set, and
    takes the stabilizer of the base state. This is the finite-state form of
    the Stallings core-completion argument.
  authors:
    - "Arthur Freitas Ramos"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"

repository:
  role: "substantive-development"

classification:
  arxiv: ["math.GR"]
  msc2020: ["20E07", "20F65", "05C25"]

